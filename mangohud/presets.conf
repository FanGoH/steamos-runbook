# Steam QAM performance overlay presets for mangoapp.
# Only preset 2 is overridden: stock horizontal bar plus
# horizontal_stretch=0 and background_alpha=0 so the 1920x1080 overlay
# does not 1/4-flash on 4K HDMI. Presets 0/1/3/4 stay mangoapp defaults.

[preset 2]
inherit
horizontal_stretch=0
background_alpha=0
