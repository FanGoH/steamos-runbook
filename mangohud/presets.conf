# Steam QAM performance overlay presets for mangoapp.
# Preset 2 is the horizontal bar. Stretch it to HDMI width (mangoapp
# glfwSetWindowSize uses gamescope outputWidth). Headless :2 must not
# share the mangoapp SysV queue or outputWidth stays 1080p and the bar
# 1/4-flashes. Presets 0/1/3/4 stay mangoapp defaults.

[preset 2]
inherit
horizontal
horizontal_stretch=1
background_alpha=0.5
