<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#10141c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FGPC" />
    <title>FGPC</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="brand">
          <strong>FGPC</strong>
          <span id="host-line">Steam Machine</span>
        </div>
        <button type="button" id="refresh" class="icon-btn">Refresh</button>
      </header>
      <p id="status-line" class="status">Loading…</p>
      <p id="toast" class="toast" hidden></p>
      <main id="panels" class="panels"></main>
      <nav id="tabs" class="tabs" aria-label="FGPC groups"></nav>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
