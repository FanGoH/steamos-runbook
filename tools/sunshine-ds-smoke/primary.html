<!doctype html>
<html><head><title>SUNSHINE-DS PRIMARY</title>
<meta http-equiv="Cache-Control" content="no-store">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#c41e3a;color:#fff;font:56px/1.2 sans-serif}
#label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;pointer-events:none;z-index:0}
#t{font:28px/1.2 monospace;margin-top:12px}
#pad-status,#pad-sticks{font:22px/1.3 monospace;margin-top:10px;max-width:90vw;text-align:center}
.pad-wait{opacity:.75}
.pad-ok{opacity:1}
#pad-buttons{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;max-width:92vw}
.btn{font:18px/1 sans-serif;min-width:52px;padding:10px 12px;border:2px solid #fff;border-radius:10px;opacity:.35;background:transparent;text-align:center}
.btn.on{opacity:1;background:#fff;color:#c41e3a;font-weight:800}
#box{
  position:absolute;width:200px;height:200px;background:#fff;color:#c41e3a;
  display:flex;align-items:center;justify-content:center;font:28px/1.1 sans-serif;font-weight:700;z-index:1;
  animation:bounce 1.6s linear infinite alternate;
  will-change:left,top;
}
@keyframes bounce{
  from{left:0;top:0}
  to{left:calc(100vw - 200px);top:calc(100vh - 200px)}
}
</style></head>
<body>
<div id="label">
  <div>PRIMARY TV 1920x1080</div>
  <div id="t"></div>
  <div id="pad-status" class="pad-wait">waiting for gamepad — press any button on Thor</div>
  <div id="pad-buttons"></div>
  <div id="pad-sticks"></div>
</div>
<div id="box">MOVE</div>
<script>
const t=document.getElementById('t');
function tick(){ t.textContent=new Date().toISOString().slice(11,23)+'  '+innerWidth+'x'+innerHeight; }
setInterval(tick,200);
tick();
</script>
<script src="pad.js"></script>
</body></html>
